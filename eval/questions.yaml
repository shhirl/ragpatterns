  status: pending graph extraction (v2); reference fixed after the extraction table is reviewed
  question: "Which of my books argue with each other?"
  reference: "Pairs linked by a MENTIONS or ARGUES_WITH edge in graph.json, each with the highlight or note that proves the link."

- id: Q5
  tests: an answer that starts from pixels
  status: pending photo crops (Shirley's yes on the copyright rule) and the multimodal index (v3)
  question: "[A photographed page] Which book is this, and what did I highlight near it?"
