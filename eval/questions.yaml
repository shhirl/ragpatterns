# The fixed questions and their reference answers (six planned; Q7, Q8, Q9 added by Shirley on 10 Sep 2026: a join, an aggregate, an aggregate over time). Written before any pipeline runs.
# Status per question: ready | pending (what it waits for). Shirley approves this file before v1 measures anything.
# Dates on the site are month + year; exact dates here are fine, they are not published.

- id: Q1
  tests: a single quotation that sits in the index; the control every pattern should pass
  status: pending Kindle highlights (next week)
  question: "Where did I read the line about [a phrase from one of my highlights]?"
  reference: "The book and the highlight, with its location, quoted back. Nothing else."

- id: Q2
  tests: a filter over the ledger; numbers and dates have no meaning to a similarity search
  status: ready (Notion ratings merged 10 Sep 2026; Lifechanging counts as five stars)
  question: "What did I read in 2024, rated five stars, under 300 pages?"
  reference: |
    Exactly three books, and nothing else: I Who Have Never Known Men (Jacqueline Harpman, 206 pages),
    A Different Drummer (William Melvin Kelley, 245 pages), The Color Purple (Alice Walker, 287 pages).
    Any other title is wrong; the four 2024 books Shirley chose not to rate can never appear.
  sql: see service/patterns/sql_forced.py

- id: Q3
  tests: "contradicting sources about one book: her low rating and notes vs the crowd's average"
  status: ready (Notion notes are the "review"; crowd average from Open Library)
  question: "Why did I give The Fellowship of the Ring two stars when everyone else loved it?"
  reference: |
    Shirley's own reason, from her Notion notes on the book, stated as hers, ranked above any admiring
    passages and above the crowd figure (Open Library average 4.34). If her notes give no reason, say so
    rather than invent one.

- id: Q4
